<section id="form">
    <h2> Cadastro de Corrida </h2>

    <form id="form-corrida" (submit)="salvar()">
        <label for="descricao"> Descrição da Corrida* </label>
        <input type="text" name="descricao" id="descricao" [(ngModel)]="descricao" class="input01" maxlength="60" required placeholder="Ex: Maratona Noturna">

        <label for="data">Data da Corrida*</label>
        <input type="date" name="data" [(ngModel)]="data" id="data" class="input02" required>

        <label>Distâncias Disponíveis</label>
        <div class="checkbox-group">
            <input type="checkbox" name="distancia5" id="5km" class="radio01" (change)="onCheckboxChange('5km', $event)"> 5km 
            <input type="checkbox" name="distancia10" id="10km" class="radio01" (change)="onCheckboxChange('10km', $event)"> 10km
            <input type="checkbox" name="distancia25" id="25km" class="radio01" (change)="onCheckboxChange('25km', $event)"> 25km
        </div>

        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar </button>
            <button type="reset" id="btnLimpar"> Limpar </button>
        </div>

    </form>
</section>
