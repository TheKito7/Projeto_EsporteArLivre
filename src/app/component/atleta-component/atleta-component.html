<div id=" div-form">

    <form id="form-atle">
     <label for="nome"> Nome</label>
     <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">
     
     <label for="cpf"> CPF</label>
     <input type="text" name="cpf" id="cpf" class="input02" required maxlength="80" placeholder="Informe seu CPF">
     
     <label for="sexo"> sexo </label>
     <input type="radio" name="sexo" id="sexoM" class="bntSelecao" value="M">Masculino
     <input type="radio" name="sexo" id="sexoF" class="bntSelecao" value="F"> Feminino
     <input type="radio" name="sexo" id="sexoN" class="bntSelecao" value="N"> Não se aplica 
     
     <label for="cep"> CEP</label>
     <input type="text" name="cep" id="cep" class="input02" required maxlength="10" placeholder="Informe seu CEP">
     
     <label for="rua-logradouro"> Rua/Logradouro</label>
     <input type="text" name="rua-logradouro id="rua-logradouro class="input01" required maxlength="8" placeholder="Informe seu Logradouro">
     
     <label for="bairro"> Bairro</label>
     <input type="text" name="bairro" id="bairro" class="input02" required maxlength="20" placeholder="Informe seu bairro">
     
     <label for="uf">UF</label>
     <input type="text" name="uf" class="input02" required maxlength="2" placeholder="Informe sua UF">

     <label for="cidade"> Cidade </label>
     <input type="text" name="cidade" id="cidade" class="input01" required maxlength="50" placeholder="Informe sua cidade">

     


     <div id="div-btn">
        <button type="submit" id="btnAdd">Cadastrar Atleta</button>
        <button type="submit" id="btnLimp">Limpar </button>
     </div>

    </form>
</div>
